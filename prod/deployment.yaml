apiVersion: apps/v1
kind: Deployment

metadata:
  name: payment-service
  namespace: prod

  labels:
    app: payment-service
    environment: prod

spec:

  replicas: 2

  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: payment-service

  template:

    metadata:
      labels:
        app: payment-service
        environment: prod

    spec:

      serviceAccountName: payment-service

      containers:

        - name: payment-service

          image: 183366578649.dkr.ecr.ap-south-1.amazonaws.com/payment-service:1.0.0

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /
              port: http

            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http

            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
